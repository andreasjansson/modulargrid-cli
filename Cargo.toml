[package]
name = "modulargrid"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "cookies", "rustls", "gzip", "form", "query", "http2"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tungstenite = "0.30.0"
url = "2.5.8"
